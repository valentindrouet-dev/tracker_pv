/* === Micro-ajustement PV central (visuel seulement) === */
.edit-card .pv-center {
  height: 36px;
  min-height: 36px;
  line-height: 36px;
  font-weight: 800;
  font-size: 1.05rem;
  text-align: center;
  padding: 0 10px;
  border-radius: .5rem;
  box-sizing: border-box;
  vertical-align: middle;
}


/* UI Reset: remove any accidental extra top padding on edit cards */
.edit-card { padding-top: 0 !important; }


/* UI Fix 6.4: hide PV/PV Max badge in edit mode */
.edit-card .badge { display: none !important; }


20%  { opacity: 1; }
  100% { opacity: 0; }
}


18%  { opacity: 1; }
  100% { opacity: 0; }
}


/* UI 6.6: flash feedback on the button itself */
.edit-card .big-keys .key,
.card .big-keys .key { position: relative; overflow: visible; }

.key.btn-flash-pos::after,
.key.btn-flash-neg::after{
  content:"";
  position:absolute;
  inset:-2px;
  border-radius: inherit;
  pointer-events:none;
  animation: btnFlash 300ms ease-out;
}

.key.btn-flash-pos::after{ box-shadow: 0 0 0 3px rgba(40, 200, 120, 0.55); }
.key.btn-flash-neg::after{ box-shadow: 0 0 0 3px rgba(220, 60, 60, 0.6); }

@keyframes btnFlash {
  0%   { opacity: 0; }
  20%  { opacity: 1; }
  100% { opacity: 0; }
}


/* UI 6.6b: ensure flash applies to ANY .key button, not only inside .big-keys */
.key { position: relative; overflow: visible; }

.key.btn-flash-pos::after,
.key.btn-flash-neg::after{
  content:"";
  position:absolute;
  inset:-3px;
  border-radius: inherit;
  pointer-events:none;
  animation: btnFlash 340ms ease-out;
}
.key.btn-flash-pos::after{ box-shadow: 0 0 0 3px rgba(40, 200, 120, 0.65); }
.key.btn-flash-neg::after{ box-shadow: 0 0 0 3px rgba(220, 60, 60, 0.7); }

@keyframes btnFlash {
  0%   { opacity: 0; transform: scale(1); }
  20%  { opacity: 1; transform: scale(0.98); }
  100% { opacity: 0; transform: scale(1); }
}


/* UI 6.7: DEAD style when HP == 0 */
.hp-bar-container.dead{
  position: relative;
  background: repeating-linear-gradient(
      -45deg,
      rgba(120,0,0,0.35) 0,
      rgba(120,0,0,0.35) 12px,
      rgba(80,0,0,0.35) 12px,
      rgba(80,0,0,0.35) 24px
  ) !important;
  box-shadow: inset 0 0 0 2px rgba(120,0,0,0.35), inset 0 4px 6px rgba(0,0,0,0.45);
}
.hp-bar-container.dead::after{
  content: "☠️";
  position:absolute;
  inset: 0;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight: 800;
  font-size: 1.2rem;
  color: #ff6b6b;
  text-shadow: 0 1px 0 rgba(0,0,0,0.6);
  pointer-events:none;
}
.hp-bar-container.dead .hp-bar{
  background: transparent !important;
  color: transparent !important;
  width: 100% !important;   /* so the capsule keeps same height/rounding */
}


/* UI 6.7b: lighten DEAD bar (more visible, not too vivid) */
.hp-bar-container.dead{
  background: repeating-linear-gradient(
      -45deg,
      rgba(170, 35, 35, 0.28) 0,
      rgba(170, 35, 35, 0.28) 10px,
      rgba(120, 20, 20, 0.20) 10px,
      rgba(120, 20, 20, 0.20) 20px
  ) !important;
  box-shadow:
    inset 0 0 0 2px rgba(190, 90, 90, 0.40),

}
.hp-bar-container.dead::after{
  color: #ff8a8a; /* a touch brighter for readability */
  text-shadow: 0 1px 0 rgba(0,0,0,0.55);
}


/* UI 6.7c: dead bar = empty capsule + skull (no red background) */
.hp-bar-container.dead{
  background: #0f1419 !important;            /* back to neutral capsule */
  box-shadow: inset 0 2px 4px rgba(0,0,0,.35) !important;
}
.hp-bar-container.dead::after{
  content: "☠️";
  color: #e6e6e6;
  text-shadow: 0 1px 0 rgba(0,0,0,0.55);
}
.hp-bar-container.dead .hp-bar{
  background: transparent !important;
  color: transparent !important;
  width: 0 !important;                        /* truly empty bar */
}

/* État BLINDAGE : filtre bleu cyan plus opaque */
.hp-bar-container.shielded::before{
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg,
    rgba(59, 130, 246, 0.6),

}

/* Carte d'édition en danger critique (HP rouges < 10%) */
.edit-card.critical {
  box-shadow: 0 0 20px rgba(239, 68, 68, 0.5), 0 8px 18px rgba(0,0,0,.22);
  border-color: rgba(239, 68, 68, 0.6);
  animation: criticalCardPulse 2s ease-in-out infinite;
}

@keyframes criticalCardPulse {

/* === BOSS SYSTEM: Circular HP Bars === */
.boss-section {
  margin-top: 1.5rem;
  padding-top: 1rem;
  border-top: 2px solid var(--border);
}

.boss-section-title {
  font-size: 1.1rem;
  font-weight: 800;
  color: #ef4444;
  margin-bottom: 0.8rem;
  text-align: center;

.boss-grid {
  display: grid;

.boss-display {

.boss-circular-bar {

}

.boss-image-container {

  left: 50%;

}

  <div class="topbar">

      <div class="edit-stack" id="edit-stack"></div>
      <div style="height:.4rem;"></div>
      <div class="display-card" style="margin-top:.2rem;">
        <button class="btn" onclick="addPlayer()" aria-label="Ajouter un nouveau joueur" style="width: 100%;">+ Ajouter</button>
      </div>
      <div class="display-card" style="margin-top: 1rem;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
          <h3 style="font-size: 0.9rem; font-weight: 700; color: #e5e7eb; margin: 0;">📜 Historique des Dégâts</h3>
          <button class="danger-btn" onclick="playerHistory = []; render();" style="font-size: 0.75rem; padding: 0.3rem 0.5rem;">🗑️ Effacer</button>

          <h3 style="font-size: 0.9rem; font-weight: 700; color: #e5e7eb; margin: 0;">📜 Historique des Dégâts</h3>
          <button class="danger-btn" onclick="bossHistory = []; render();" style="font-size: 0.75rem; padding: 0.3rem 0.5rem;">🗑️ Effacer</button>

  <div id="fullscreen" class="fullscreen">
    <button onclick="toggleFullscreen()" class="btn fullscreen-close" aria-label="Quitter le mode plein écran">Quitter le plein écran</button>
    <div id="fullscreen-content" class="fullscreen-content"></div>
  </div>

  <!-- Vue joueur individuelle (mobile) -->
  <div id="player-view" class="player-view">
    <div id="player-view-content" class="player-view-content"></div>
  </div>

  <!-- Vue ennemi individuelle (mobile) -->
  <div id="boss-view" class="player-view">
    <div id="boss-view-content" class="player-view-content"></div>
  </div>

  <!-- Toast pour notifications d'erreurs/succès -->
  <div id="toast" style="position:fixed; top:1rem; left:50%; transform:translateX(-50%); z-index:999; display:none;
    padding:.8rem 1.2rem; background:#ef4444; color:white; border-radius:8px;
    box-shadow:0 4px 12px rgba(0,0,0,.3); font-weight:600; max-width:320px; text-align:center;"></div>

  <script>
    function setTab(which) {
      // Avertissement pour l'onglet MJ
      if (which === 'mj') {
        if (!confirm('⚠️ Attention, cette section est réservée au Maître du Jeu !\n\nElle contient des informations sur les ennemis cachés et les contrôles de la partie.\n\nContinuer ?')) {
          return; // Annuler le changement d'onglet
        }
      }

      document.getElementById('section-display').style.display = which === 'display' ? '' : 'none';
      document.getElementById('section-edit').style.display = which === 'edit' ? '' : 'none';
      document.getElementById('section-mj').style.display = which === 'mj' ? '' : 'none';
      document.getElementById('tab-display').classList.toggle('active', which === 'display');
      document.getElementById('tab-edit').classList.toggle('active', which === 'edit');
      document.getElementById('tab-mj').classList.toggle('active', which === 'mj');
    }

    // Système de notifications toast
    function showToast(msg, type='error') {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.style.background = type === 'error' ? '#ef4444' : type === 'success' ? '#22c55e' : '#f59e0b';
      toast.style.display = 'block';
      setTimeout(() => toast.style.display = 'none', type === 'success' ? 2000 : 4000);
    }

    const defaultPlayers = [
      { id: 1, name: "Alchimiste", hp: 32, max: 50, color: "#4a6edb", shielded: false },
      { id: 2, name: "Destructeur", hp: 48, max: 50, color: "#c13b3b", shielded: false },
      { id: 3, name: "Pyromane", hp: 20, max: 50, color: "#e6a500", shielded: false },
      { id: 4, name: "Déviant", hp: 24, max: 50, color: "#c07ce6", shielded: false },
      { id: 5, name: "Lamevent", hp: 28, max: 50, color: "#60a853", shielded: false }
    ];

    const defaultBosses = [];

    let players = [];
    let bosses = [];
    let sortMode = 'none';
    let nextId = 6;
    let nextBossId = 1;
    let bossHistory = []; // Historique des actions sur les ennemis
    let playerHistory = []; // Historique des actions sur les joueurs
    const USE_FIREBASE = true;

    let playersCol;
    let bossesCol;

    function saveData() {
      if (!USE_FIREBASE) {
        localStorage.setItem('pv-tracker-v1', JSON.stringify({ players, bosses }));
      }
      // L'historique est toujours sauvegardé en localStorage, même en mode Firebase
      localStorage.setItem('pv-tracker-boss-history', JSON.stringify(bossHistory));
      localStorage.setItem('pv-tracker-player-history', JSON.stringify(playerHistory));
    }
    function loadData() {
      if (!USE_FIREBASE) {
        const saved = localStorage.getItem('pv-tracker-v1');
        if (saved) {
          try {
            const data = JSON.parse(saved);
            if (data.players) {
              players = data.players;
              bosses = data.bosses || [];
              nextId = players.length ? Math.max(...players.map(p => p.id)) + 1 : 1;
              nextBossId = bosses.length ? Math.max(...bosses.map(b => b.id)) + 1 : 1;
            } else {
              // Old format compatibility
              players = data;
              bosses = [];
              nextId = players.length ? Math.max(...players.map(p => p.id)) + 1 : 1;
              nextBossId = 1;
            }
          }
          catch {
            players = JSON.parse(JSON.stringify(defaultPlayers));
            bosses = JSON.parse(JSON.stringify(defaultBosses));
            nextId = 6;
            nextBossId = 1;
          }
        } else {
          players = JSON.parse(JSON.stringify(defaultPlayers));
          bosses = JSON.parse(JSON.stringify(defaultBosses));
          nextId = 6;
          nextBossId = 1;
        }
      }
      // Charger les historiques depuis localStorage (toujours, même en mode Firebase)
      const savedBossHistory = localStorage.getItem('pv-tracker-boss-history');
      if (savedBossHistory) {
        try {
          bossHistory = JSON.parse(savedBossHistory);
        } catch {
          bossHistory = [];
        }
      }
      const savedPlayerHistory = localStorage.getItem('pv-tracker-player-history');
      if (savedPlayerHistory) {
        try {
          playerHistory = JSON.parse(savedPlayerHistory);
        } catch {
          playerHistory = [];
        }
      }
    }

    async function resetAll() {
      if (!USE_FIREBASE) {
        players = JSON.parse(JSON.stringify(defaultPlayers));
        bosses = JSON.parse(JSON.stringify(defaultBosses));
        nextId = 6;
        nextBossId = 1;
        return render();
      }
      try {
        // Reset players
        const snap = await playersCol.get();
        const batch1 = db.batch();
        snap.forEach(doc => {
          batch1.set(doc.ref, { __deleted: true, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
        });
        await batch1.commit();

        const batch2 = db.batch();
        defaultPlayers.forEach(p => {
          const ref = playersCol.doc(String(p.id));
          batch2.set(ref, { ...p, __deleted: false, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
        });
        await batch2.commit();

        // Reset bosses
        const bossSnap = await bossesCol.get();
        const batch3 = db.batch();
        bossSnap.forEach(doc => {
          batch3.set(doc.ref, { __deleted: true, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
        });
        await batch3.commit();

        showToast('✅ Réinitialisation réussie', 'success');
      } catch (e) {
        console.error('resetAll failed', e);
        showToast('⚠️ Erreur de réinitialisation. Réessayez.', 'error');
      }
    }

    function addPlayer() {
      if (!USE_FIREBASE) { players.push({ id: nextId++, name: "Nouveau", hp: 10, max: 20, color: "#9ca3af", shielded: false }); return render(); }
      const p = { id: nextId++, name: "Nouveau", hp: 10, max: 20, color: "#9ca3af", shielded: false, __deleted: false, updatedAt: firebase.firestore.FieldValue.serverTimestamp() };
      playersCol.doc(String(p.id)).set(p, { merge: true });
    }

    async function removePlayer(id, docId) {
      // UI optimiste
      players = players.filter(p => p.id != id);
      render();

      if (!USE_FIREBASE) return;
      try {
        if (docId) {
          await playersCol.doc(docId).set({ __deleted: true, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
          return;
        }
      } catch (e) {
        console.warn('soft delete by docId failed, fallback to query', e);
      }
      try {
        const q = await playersCol.where('id', '==', id).limit(1).get();
        if (!q.empty) {
          await q.docs[0].ref.set({ __deleted: true, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
        }
      } catch (e) {
        console.error('soft delete by id failed', e);
        showToast('⚠️ Erreur de suppression. Réessayez.', 'error');
      }
    }

    function updatePlayer(id, field, value) {
      if (!USE_FIREBASE) {
        const player = players.find(p => p.id === id);
        if (player) {
          if (field === 'max') {
            const v = Math.max(1, Number(value)||1);
            player.max = v;
            if (player.hp > v) player.hp = v;
          } else if (field === 'name') {
            player.name = value;
          } else if (field === 'color') {
            player.color = value;
          } else if (field === 'hp') {
            const v = Math.max(0, Math.min(player.max, Number(value)||0));
            player.hp = v;
          }
          render();
        }
        return;
      }
      const patch = { updatedAt: firebase.firestore.FieldValue.serverTimestamp() };
      if (field === 'max') patch.max = Math.max(1, Number(value) || 1);
      else if (field === 'name' || field === 'color') patch[field] = value;
      else if (field === 'hp') patch.hp = Math.max(0, Number(value) || 0);
      playersCol.doc(String(id)).set(patch, { merge: true });
    }

    function toggleShield(id) {
      if (!USE_FIREBASE) {
        const player = players.find(p => p.id === id);
        if (player) {
          player.shielded = !player.shielded;
          const type = player.shielded ? 'shield_on' : 'shield_off';
          addToPlayerHistory(player.id, player.name, type);
          render();
        }
        return;
      }
      playersCol.doc(String(id)).get().then(snap => {
        const data = snap.data();
        if (!data) return;
        const current = data.shielded || false;
        const type = !current ? 'shield_on' : 'shield_off';
        addToPlayerHistory(id, data.name, type);
        return playersCol.doc(String(id)).set({ shielded: !current, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
      });
    }

    function applyFireDamage(id) {
      const fireDamage = Math.floor(Math.random() * 6) + 1; // 1d6
      if (!USE_FIREBASE) {
        const player = players.find(p => p.id === id);
        if (player) {
          const oldHP = player.hp;
          // Si blindage actif, il absorbe le feu
          if (player.shielded) {
            player.shielded = false;
            addToPlayerHistory(player.id, player.name, 'shield_absorbed', oldHP, oldHP, fireDamage);
            render();
            showToast('Blindage absorbe !', 'warning');
            return;
          }
          const newHP = Math.max(0, player.hp - fireDamage);
          player.hp = newHP;
          addToPlayerHistory(player.id, player.name, 'burn', oldHP, newHP, fireDamage);
          render();
          flashPlayer(id, 'burn');
        }
        return;
      }
      playersCol.doc(String(id)).get().then(async snap => {
        const p = snap.data();
        if (!p) return;
        const oldHP = p.hp || 0;
        // Si blindage actif, il absorbe le feu
        if (p.shielded) {
          addToPlayerHistory(id, p.name, 'shield_absorbed', oldHP, oldHP, fireDamage);

        render();
        showToast('✅ Ennemis triés par nom', 'success');

      bosses.forEach((boss, index) => {

    function moveBoss(id, direction) {
      const index = bosses.findIndex(b => b.id === id);
      if (index === -1) return;

      const newIndex = direction === 'up' ? index - 1 : index + 1;
      if (newIndex < 0 || newIndex >= bosses.length) return;

      // Swap bosses
      [bosses[index], bosses[newIndex]] = [bosses[newIndex], bosses[index]];

      if (!USE_FIREBASE) {
        render();
        return;
      }

      // Update order in Firebase
      bosses.forEach((boss, idx) => {
        const docId = boss._docId || String(boss.id);
        bossesCol.doc(docId).set({ order: idx, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
      });

      render();
    }

    function updateBoss(id, field, val) {
      if (!USE_FIREBASE) {
        const boss = bosses.find(b => b.id === id);
        if (boss) {
          // Si c'est un soin total (HP = max), ajouter à l'historique
          if (field === 'hp' && val === boss.max && boss.hp < boss.max) {
            const oldHP = boss.hp;
            boss.hp = val;
            addToBossHistory(boss.id, boss.name, 'full_heal', oldHP, val);
          } else {
            boss[field] = val;
          }
          render();
        }
        return;
      }
      // Mode Firebase : récupérer les données pour détecter le soin total
      if (field === 'hp') {
        bossesCol.doc(String(id)).get().then(snap => {
          const data = snap.data();
          if (data && val === data.max && data.hp < data.max) {
            addToBossHistory(id, data.name, 'full_heal', data.hp, val);
          }
          bossesCol.doc(String(id)).set({ [field]: val, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
        });
      } else {
        const upd = { [field]: val, updatedAt: firebase.firestore.FieldValue.serverTimestamp() };
        bossesCol.doc(String(id)).set(upd, { merge: true });
      }
    }

    function changeBossHP(id, delta) {
      if (!USE_FIREBASE) {
        const boss = bosses.find(b => b.id === id);
        if (boss) {
          const oldHP = boss.hp;
          const oldShielded = boss.shielded;
          // Si blindage actif et dégâts négatifs → désactiver blindage au lieu de perdre HP
          if (boss.shielded && delta < 0) {
            boss.shielded = false;
            addToBossHistory(boss.id, boss.name, 'shield_absorbed', oldHP, oldHP, Math.abs(delta));
            render();
            showToast('Blindage absorbe !', 'warning');
            return;
          }
          const newHP = Math.max(0, Math.min(boss.max, boss.hp + delta));
          boss.hp = newHP;
          const type = delta < 0 ? 'damage' : 'heal';
          addToBossHistory(boss.id, boss.name, type, oldHP, newHP);
          render();
          flashBoss(id, delta > 0 ? 'up' : 'down');
        }
        return;
      }
      bossesCol.doc(String(id)).get().then(snap => {
        const data = snap.data();
        if (!data) return;
        const oldHP = data.hp;
        const oldShielded = data.shielded;
        // Si blindage actif et dégâts négatifs → désactiver blindage au lieu de perdre HP
        if (data.shielded && delta < 0) {
          addToBossHistory(id, data.name, 'shield_absorbed', oldHP, oldHP, Math.abs(delta));
          bossesCol.doc(String(id)).set({ shielded: false, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
          showToast('Blindage absorbe !', 'warning');
          return;

        const newHP = Math.max(0, Math.min(data.max, data.hp + delta));
        const type = delta < 0 ? 'damage' : 'heal';
        addToBossHistory(id, data.name, type, oldHP, newHP);
        bossesCol.doc(String(id)).set({ hp: newHP, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
        flashBoss(id, delta > 0 ? 'up' : 'down');

    // === HISTORIQUE DES ACTIONS ===
    function addToBossHistory(bossId, bossName, type, oldHP = null, newHP = null, damageAvoided = null) {
      const now = new Date();
      const time = now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
      const timestamp = now.getTime();

      // Annulation des blindages opposés dans les 5 secondes
      if ((type === 'shield_on' || type === 'shield_off') && bossHistory.length > 0) {
        const oppositeType = type === 'shield_on' ? 'shield_off' : 'shield_on';
        const recentOppositeIndex = bossHistory.findIndex(action => {
          if (action.bossId !== bossId) return false;
          if (action.type !== oppositeType) return false;
          const timeDiff = timestamp - action.timestamp;
          return timeDiff < 5000; // 5 secondes
        });

        if (recentOppositeIndex !== -1) {
          // Supprimer l'action opposée et ne pas ajouter la nouvelle
          bossHistory.splice(recentOppositeIndex, 1);
          saveData();
          render();
          return;
        }
      }

      // Regroupement uniquement pour les dégâts/soins standard (pas pour shield, death, full_heal)
      if ((type === 'damage' || type === 'heal') && bossHistory.length > 0) {
        const lastAction = bossHistory[0];
        if (lastAction.bossId === bossId && (lastAction.type === 'damage' || lastAction.type === 'heal')) {
          const timeDiff = timestamp - lastAction.timestamp;
          if (timeDiff < 5000) { // 5 secondes
            // Mettre à jour l'action existante
            lastAction.newHP = newHP;
            lastAction.delta = newHP - lastAction.oldHP;
            lastAction.timestamp = timestamp;
            lastAction.time = time;
            saveData();
            render();
            return;
          }
        }
      }

      const delta = (oldHP !== null && newHP !== null) ? (newHP - oldHP) : 0;
      const action = {
        id: timestamp,
        timestamp: timestamp,
        time: time,
        bossId: bossId,
        bossName: bossName,
        type: type, // damage, heal, shield_on, shield_off, death, full_heal, shield_absorbed
        oldHP: oldHP,
        newHP: newHP,
        delta: delta,
        damageAvoided: damageAvoided
      };

      bossHistory.unshift(action);
      if (bossHistory.length > 20) bossHistory.pop();
      saveData();
      render();
    }

    function undoBossAction(actionId) {
      const action = bossHistory.find(a => (a.id || a.timestamp) == actionId);
      if (!action) return;

      // Restaurer l'état si c'est un changement de HP
      if (action.oldHP !== null && action.type !== 'shield_on' && action.type !== 'shield_off') {
        if (USE_FIREBASE) {
          bossesCol.doc(String(action.bossId)).update({
            hp: action.oldHP,
            updatedAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        } else {
          const boss = bosses.find(b => b.id === action.bossId);
          if (boss) {
            boss.hp = action.oldHP;
          }
        }
      }

      // Supprimer l'action de l'historique
      bossHistory = bossHistory.filter(a => (a.id || a.timestamp) != actionId);
      saveData();
      render();
      showToast('✅ Action annulée', 'success');
    }

    function undoPlayerAction(actionId) {

      if (action.oldHP !== null && action.type !== 'shield_on' && action.type !== 'shield_off') {

    // Fonction helper pour générer la dernière ligne d'historique pour la vue mobile
    function getLastHistoryLineHTML(historyArray, entityType) {
      if (!historyArray || historyArray.length === 0) {
        return '<div style="text-align: center; padding: 0.5rem; color: #6b7280; font-size: 0.75rem;">Aucune action récente</div>';
      }

      const action = historyArray[0]; // Dernière action
      let message, borderColor, entityColor, entityName, entityMax;

      if (entityType === 'boss') {
        const boss = bosses.find(b => b.id === action.bossId);
        const enemyColor = boss?.color || '#7D7E7E';
        entityMax = boss?.max || 100;
        entityName = action.bossName;

        if (enemyColor.toUpperCase() === '#846BAF') {
          entityColor = '#b39ddb'; // Unique - violet
        } else if (enemyColor.toUpperCase() === '#BF5750') {
          entityColor = '#e57373'; // Solitaire - rouge
        } else {
          entityColor = '#a1a1a1'; // Sbire - gris
        }
      } else {
        const player = players.find(p => p.id === action.playerId);
        entityColor = player?.color || '#22c55e';
        entityMax = player?.max || 100;
        entityName = action.playerName;
      }

      // Générer le message selon le type
      if (action.type === 'death') {
        const oldColor = getHPTextColor(action.oldHP, entityMax);
        message = `<strong style="color: ${entityColor};">${entityName}</strong> est mort et passe de <strong style="color: ${oldColor};">${action.oldHP}</strong> à <strong style="color: #dc2626;">0</strong> pv`;
        borderColor = '#dc2626';
      } else if (action.type === 'full_heal') {
        const oldColor = getHPTextColor(action.oldHP, entityMax);
        const newColor = getHPTextColor(action.newHP, entityMax);
        const healAmount = action.newHP - action.oldHP;
        message = `<strong style="color: ${entityColor};">${entityName}</strong> récupère tous ses PV (<strong style="color: ${oldColor};">${action.oldHP}</strong> → <strong style="color: ${newColor};">${action.newHP}</strong>)`;
        borderColor = '#22c55e';
      } else if (action.type === 'shield_on') {
        message = `<strong style="color: ${entityColor};">${entityName}</strong> active son <strong style="color: #2563eb;">blindage</strong>`;
        borderColor = '#2563eb';
      } else if (action.type === 'shield_off') {
        message = `<strong style="color: ${entityColor};">${entityName}</strong> perd son <strong style="color: #2563eb;">blindage</strong>`;
        borderColor = '#9ca3af';
      } else if (action.type === 'shield_absorbed') {
        if (action.damageAvoided === 'death') {
          message = `<strong style="color: ${entityColor};">${entityName}</strong> perd son <strong style="color: #2563eb;">blindage</strong> et évite la mort`;
        } else {
          message = `<strong style="color: ${entityColor};">${entityName}</strong> perd son <strong style="color: #2563eb;">blindage</strong> et évite de perdre <span style="color: #fca5a5; font-weight: 600;">-${action.damageAvoided} pv</span>`;
        }
        borderColor = '#2563eb';
      } else if (action.type === 'burn') {
        const fireDamage = action.damageAvoided || Math.abs(action.delta);
        message = `<strong style="color: ${entityColor};">${entityName}</strong> subit une <strong style="color: #fb923c;">brûlure</strong> <span style="color: #fca5a5; font-weight: 600;">(-${fireDamage} pv)</span> !`;
        borderColor = '#fb923c';
      } else {
        // damage ou heal
        const deltaText = action.delta > 0 ? `(+${action.delta} pv)` : `(${action.delta} pv)`;
        const deltaColor = action.delta > 0 ? '#86efac' : '#fca5a5';
        const oldColor = getHPTextColor(action.oldHP, entityMax);
        const newColor = getHPTextColor(action.newHP, entityMax);
        message = `<strong style="color: ${entityColor};">${entityName}</strong> passe de <strong style="color: ${oldColor};">${action.oldHP}</strong> à <strong style="color: ${newColor};">${action.newHP}</strong> pv <span style="color: ${deltaColor}; font-weight: 600;">${deltaText}</span>`;
        borderColor = action.delta > 0 ? '#86efac' : '#fca5a5';
      }

      return `
        <div style="padding: 0.5rem; background: rgba(30, 41, 59, 0.5); border-radius: 6px; border-left: 3px solid ${borderColor};">
          <span style="color: #9ca3af; font-size: 0.7rem; font-weight: 600;">${action.time}</span>
          <span style="color: #e5e7eb; font-size: 0.8rem; margin-left: 0.5rem; display: inline-block;">
            ${message}
          </span>
        </div>
      `;
    }

    let currentBossViewId = null;

    function openBossView(id) {
      currentBossViewId = id;

      document.documentElement.requestFullscreen?.();

    function renderBossView() {
      if (!currentBossViewId) return;
      const boss = bosses.find(b => b.id === currentBossViewId);
      if (!boss) {
        closeBossView();
        return;
      }

      const percent = Math.round((boss.hp / boss.max) * 100);
      const enemyColor = boss.color || '#7D7E7E';

      // Create gradient based on enemy type

    const debounceMap = new Map();
    function changeHP(id, delta) {
      if (!USE_FIREBASE) {
        const player = players.find(p => p.id === id);
        if (player) {
          const oldHP = player.hp;
          // Si blindage actif et dégâts négatifs → désactiver blindage au lieu de perdre HP
          if (player.shielded && delta < 0) {
            player.shielded = false;
            addToPlayerHistory(player.id, player.name, 'shield_absorbed', oldHP, oldHP, Math.abs(delta));
            render();
            showToast('Blindage absorbe !', 'warning');
            return;
          }
          const newHP = Math.max(0, Math.min(player.max, player.hp + delta));
          player.hp = newHP;
          const type = delta < 0 ? 'damage' : 'heal';
          addToPlayerHistory(player.id, player.name, type, oldHP, newHP);
          render();
          flashPlayer(id, delta > 0 ? 'up' : 'down');
        }
        return;
      }
      clearTimeout(debounceMap.get(id));
      const t = setTimeout(async () => {
        const snap = await playersCol.doc(String(id)).get();
        const p = snap.data(); if (!p) return;
        const oldHP = p.hp || 0;
        // Si blindage actif et dégâts négatifs → désactiver blindage au lieu de perdre HP
        if (p.shielded && delta < 0) {
          addToPlayerHistory(id, p.name, 'shield_absorbed', oldHP, oldHP, Math.abs(delta));
          await playersCol.doc(String(id)).set({ shielded: false, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
          showToast('Blindage absorbe !', 'warning');
          return;
        }
        const next = Math.max(0, Math.min(p.max, oldHP + delta));
        const type = delta < 0 ? 'damage' : 'heal';
        addToPlayerHistory(id, p.name, type, oldHP, next);
        playersCol.doc(String(id)).set({ hp: next, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
      }, 110);
      debounceMap.set(id, t);
    }
    function setHP(id, value) {
      if (!USE_FIREBASE) {
        const player = players.find(p => p.id === id);
        if (player) {
          const oldHP = player.hp;
          const newHP = Math.max(0, Math.min(player.max, Number(value)||0));
          // Si blindage actif et qu'on tente de réduire les HP → désactiver blindage
          if (player.shielded && newHP < oldHP) {
            player.shielded = false;
            const damageAvoided = newHP === 0 ? 'death' : oldHP - newHP;
            addToPlayerHistory(player.id, player.name, 'shield_absorbed', oldHP, oldHP, damageAvoided);
            render();
            showToast('Blindage absorbe !', 'warning');
            return;
          }
          player.hp = newHP;
          // Déterminer le type d'événement
          if (newHP === 0 && oldHP > 0) {
            addToPlayerHistory(player.id, player.name, 'death', oldHP, newHP);
          } else if (newHP === player.max && oldHP < player.max) {
            addToPlayerHistory(player.id, player.name, 'full_heal', oldHP, newHP);
          } else if (newHP !== oldHP) {
            const type = newHP < oldHP ? 'damage' : 'heal';
            addToPlayerHistory(player.id, player.name, type, oldHP, newHP);
          }
          render();
          if (player.hp !== oldHP) flashPlayer(id, player.hp > oldHP ? 'up' : 'down');
        }
        return;
      }
      playersCol.doc(String(id)).get().then(async s => {
        const p = s.data();
        const max = Math.max(1, (p?.max ?? 1));
        const oldHP = p?.hp || 0;
        const clamped = Math.max(0, Math.min(max, Number(value) || 0));
        // Si blindage actif et qu'on tente de réduire les HP → désactiver blindage
        if (p?.shielded && clamped < oldHP) {
          const damageAvoided = clamped === 0 ? 'death' : oldHP - clamped;
          addToPlayerHistory(id, p.name, 'shield_absorbed', oldHP, oldHP, damageAvoided);
          await playersCol.doc(String(id)).set({ shielded: false, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
          showToast('Blindage absorbe !', 'warning');
          return;
        }
        // Déterminer le type d'événement
        if (clamped === 0 && oldHP > 0) {
          addToPlayerHistory(id, p.name, 'death', oldHP, clamped);
        } else if (clamped === max && oldHP < max) {
          addToPlayerHistory(id, p.name, 'full_heal', oldHP, clamped);
        } else if (clamped !== oldHP) {
          const type = clamped < oldHP ? 'damage' : 'heal';
          addToPlayerHistory(id, p.name, type, oldHP, clamped);
        }
        return playersCol.doc(String(id)).set({ hp: clamped, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
      });
    }

    function getHealthColor(percent) {
      if (percent > 50) return 'linear-gradient(90deg, #10b981, #22c55e)';
      else if (percent > 25) return 'linear-gradient(90deg, #eab308, #facc15)';
      else if (percent > 10) return 'linear-gradient(90deg, #f97316, #fb923c)';
      else return 'linear-gradient(90deg, #dc2626, #ef4444)';
    }
    function getHPTextColor(hp, max) {
      if (hp === 0) return '#dc2626';
      const percent = Math.round((hp / max) * 100);
      if (percent > 50) return '#22c55e';
      else if (percent > 25) return '#facc15';
      else if (percent > 10) return '#fb923c';
      else return '#ef4444';
    }
    function getTextColor(percent) {
      if (percent > 50) return '#004d26';
      else if (percent > 25) return '#713f12';
      else if (percent > 10) return '#7c2d12';
      else return '#450a0a';
    }
    function getBorderColor(percent) {
      if (percent > 50) return 'rgba(16,185,129,.4)';  // Vert émeraude
      else if (percent > 25) return 'rgba(234,179,8,.4)';  // Jaune
      else if (percent > 10) return 'rgba(249,115,22,.4)';  // Orange
      else return 'rgba(220,38,38,.4)';  // Rouge
    }
    function getSortedPlayers() {
      const sorted = [...players];
      if (sortMode === 'name') sorted.sort((a, b) => a.name.localeCompare(b.name));
      else if (sortMode === 'hpdesc') sorted.sort((a, b) => b.hp - a.hp);
      else if (sortMode === 'hpasc') sorted.sort((a, b) => a.hp - b.hp);
      return sorted;
    }

          .map(d => ({ ...d.data(), _docId: d.id }))
          .filter(b => !b.__deleted);

        // Sort by order field, then by id
        bosses.sort((a, b) => {
          if (a.order !== undefined && b.order !== undefined) {
            return a.order - b.order;
          }
          if (a.order !== undefined) return -1;
          if (b.order !== undefined) return 1;

  };

  function findMaxInput(card){
    const inputs = Array.from(card.querySelectorAll('input[type="number"]'));
    for (const inp of inputs){
      const name = ((inp.name||'') + ' ' + (inp.id||'') + ' ' + (inp.getAttribute('aria-label')||'')).toLowerCase();
      const prev = ((inp.previousElementSibling && inp.previousElementSibling.textContent) || '');
      const label = ((inp.closest('label') && inp.closest('label').textContent) || '');
      if (/\bmax\b/.test(name) || /\bmax\b/i.test(prev) || /\bmax\b/i.test(label)) return inp;
    }
    return null;
  }

  function placeButton(card){
    const btn = card.querySelector('.danger-btn');
    if(!btn) return false;

    // Emoji-only + a11y
    btn.textContent = '🗑️';
    btn.setAttribute('aria-label','Supprimer');
    btn.title = 'Supprimer';
    btn.style.position = 'static';

    const maxInput = findMaxInput(card);
    if(!maxInput) return false;

    // find the "capsule" around max input
    let capsule = maxInput.closest('label') || maxInput.parentElement;
    if (!capsule || capsule.classList.contains('inline-max-with-delete')) return false;

    // Ensure we don't duplicate wrappers. Remove old inline wrapper if it exists and is empty.
    const existingWrapper = capsule.parentElement && capsule.parentElement.classList && capsule.parentElement.classList.contains('inline-max-with-delete') ? capsule.parentElement : null;
    if (existingWrapper && existingWrapper.querySelector('.danger-btn')) {
      // already good
      return true;
    }

    const wrapper = existingWrapper || document.createElement('span');
    if (!existingWrapper) {
      wrapper.className = 'inline-max-with-delete';
      wrapper.style.display = 'inline-flex';
      wrapper.style.alignItems = 'center';
      wrapper.style.gap = '8px';
      capsule.parentElement.insertBefore(wrapper, capsule);
      wrapper.appendChild(capsule);
    }
    wrapper.appendChild(btn);
    return true;
  }

  function applyAll(){
    document.querySelectorAll('.edit-card').forEach(placeButton);
  }

  const boot = () => schedule(applyAll);

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }

  // Observe mutations on the root container to re-apply when cards update
  const root = document.body;
  const mo = new MutationObserver(() => schedule(applyAll));
  mo.observe(root, { childList: true, subtree: true });

  // Also hook common render triggers
  document.addEventListener('click', (e)=>{
    const t = e.target;
    if (!t) return;
    if (t.matches('[data-tab], [data-view], .btn, button')) schedule(applyAll);
  });

  // Expose a global re-align if the app calls render functions we can patch
  window.__alignDeleteNextToMax = applyAll;
})();
</script>

<script>
// UI 6.6: flash feedback on +/- buttons (button only)
(function(){
  const flashBtn = (btn, cls, dur=300) => {
    if(!btn) return;
    btn.classList.remove(cls);
    void btn.offsetWidth; // reflow to replay animation
    btn.classList.add(cls);
    setTimeout(()=> btn.classList.remove(cls), dur);
  };

  document.addEventListener('click', function(e){
    const btn = e.target.closest('button.key, .key button, .key'); // try to catch the visual key
    // If not a key, bail early.
    if (!btn || !(btn.classList && btn.classList.contains('key'))) return;

    const txt = (btn.textContent || "").trim();
    const isNeg = btn.classList.contains('neg') || /^-\d+/.test(txt) || txt.includes('☠');
    const isPos = btn.classList.contains('pos') || /^\+\d+/.test(txt) || txt.includes('💚');

    if (isNeg) return flashBtn(btn, 'btn-flash-neg');
    if (isPos) return flashBtn(btn, 'btn-flash-pos');
  }, true);
})();
</script>


<script>
// UI 6.7: Toggle 'dead' style on hp bars when width is 0%
(function(){
  function updateDeadStates(root=document){
    document.querySelectorAll('.hp-bar').forEach(el=>{
      const cont = el.closest('.hp-bar-container');
      if(!cont) return;

      // read inline width percentage if present
      let w = 0;
      const styleWidth = (el.getAttribute('style')||'').match(/width:\s*([0-9.]+)%/);
      if (styleWidth) w = parseFloat(styleWidth[1]);

      // Fallback: computed width
      if (!styleWidth){
        const cw = el.getBoundingClientRect().width;
        w = cw < 2 ? 0 : 1; // treat ultra thin as zero
      }

      if (w <= 0) cont.classList.add('dead');
      else cont.classList.remove('dead');
    });
  }

  // Run at load and on DOM changes
  const boot = () => requestAnimationFrame(updateDeadStates);
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

  const mo = new MutationObserver(()=> requestAnimationFrame(updateDeadStates));
  mo.observe(document.body, {childList:true, subtree:true, attributes:true, attributeFilter:['style']});

  // Also re-check when window resizes (rarely needed but safe)
  window.addEventListener('resize', ()=> requestAnimationFrame(updateDeadStates));

  // Expose manual hook
  window.__refreshHpDeadStates = updateDeadStates;
})();
</script>
