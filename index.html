/* UI Reset: remove any accidental extra top padding on edit cards */
.edit-card { padding-top: 0 !important; }


/* UI Fix 6.4: hide PV/PV Max badge in edit mode */

/* UI 6.6: flash feedback on the button itself */
.edit-card .big-keys .key,
.card .big-keys .key { position: relative; overflow: visible; }

.key.btn-flash-pos::after,
.key.btn-flash-neg::after{
  content:"";
  position:absolute;
  inset:-2px;
  border-radius: inherit;
  pointer-events:none;
  animation: btnFlash 300ms ease-out;
}

.key.btn-flash-pos::after{ box-shadow: 0 0 0 3px rgba(40, 200, 120, 0.55); }
.key.btn-flash-neg::after{ box-shadow: 0 0 0 3px rgba(220, 60, 60, 0.6); }

@keyframes btnFlash {
  0%   { opacity: 0; }
  20%  { opacity: 1; }
  100% { opacity: 0; }
}


/* UI 6.6b: ensure flash applies to ANY .key button, not only inside .big-keys */
.key { position: relative; overflow: visible; }

.key.btn-flash-pos::after,
.key.btn-flash-neg::after{
  content:"";
  position:absolute;
  inset:-3px;
  border-radius: inherit;
  pointer-events:none;
  animation: btnFlash 340ms ease-out;
}
.key.btn-flash-pos::after{ box-shadow: 0 0 0 3px rgba(40, 200, 120, 0.65); }
.key.btn-flash-neg::after{ box-shadow: 0 0 0 3px rgba(220, 60, 60, 0.7); }

@keyframes btnFlash {
  0%   { opacity: 0; transform: scale(1); }
  20%  { opacity: 1; transform: scale(0.98); }
  100% { opacity: 0; transform: scale(1); }
}

/* === BOSS SYSTEM: Circular HP Bars === */
.boss-section {
  margin-top: 1.5rem;
  padding-top: 1rem;
  border-top: 2px solid var(--border);
}

.boss-section-title {
  font-size: 1.1rem;
  font-weight: 800;
  color: #ef4444;
  margin-bottom: 0.8rem;
  text-align: center;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.boss-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 1rem;
  justify-items: center;
}

.boss-display {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.5rem;
}

.boss-circular-bar {
  position: relative;
  width: 140px;
  height: 140px;
}

.boss-circular-bg {
  transform: rotate(-90deg);
}

.boss-circular-progress {
  transform: rotate(-90deg);
  transition: stroke-dashoffset 0.35s ease;
}

.boss-image-container {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  width: 100px;
  height: 100px;
  border-radius: 50%;
  overflow: hidden;
  background: #0f1419;
  border: 2px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
}

.boss-image {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.boss-image-placeholder {
  font-size: 3rem;
  filter: grayscale(0.3);
}

.boss-hp-text {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 1.2rem;
  font-weight: 900;
  color: #fff;
  text-shadow: 0 2px 4px rgba(0,0,0,0.8);
  pointer-events: none;
  z-index: 10;
}

.boss-name {
  font-size: 1rem;
  font-weight: 800;
  text-align: center;
  max-width: 140px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.boss-percent {
  font-size: 0.85rem;
  color: var(--muted);
}

/* Boss edit cards */
.boss-edit-section {
  margin-top: 1.5rem;
  padding-top: 1rem;
  border-top: 2px solid var(--border);
}

.boss-edit-title {
  font-size: 1rem;
  font-weight: 800;
  color: #ef4444;
  margin-bottom: 0.6rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.add-boss-btn {
  width: 100%;
  padding: 0.6rem;
  margin-bottom: 0.6rem;
  background: var(--panel-plain);
  border: 1px dashed var(--border);
  border-radius: 10px;
  color: #ef4444;
  font-weight: 700;
  font-size: 0.9rem;
  cursor: pointer;
  transition: all 0.2s;
}

.add-boss-btn:hover {
  background: rgba(239, 68, 68, 0.1);
  border-color: #ef4444;
}

.boss-edit-card {
  background: var(--panel);
  border: 1px solid rgba(239, 68, 68, 0.3);
  border-radius: 14px;
  padding: 0.6rem;
  margin-bottom: 0.6rem;
}

.boss-edit-header {
  display: flex;
  align-items: center;
  gap: 0.45rem;
  margin-bottom: 0.5rem;
  flex-wrap: wrap;
}

.boss-image-input {
  flex: 1 1 100%;
  font-size: 0.85rem;
  padding: 0.4rem;
  background: #0f1419;
  border: 1px solid var(--border);
  border-radius: 8px;
  color: #e5e7eb;
  outline: none;
}

.boss-image-input::placeholder {
  color: var(--muted);
}

.boss-edit-controls {
  display: flex;
  gap: 0.4rem;
  align-items: center;
  flex-wrap: wrap;
}

.delete-boss-btn {
  padding: 0.4rem 0.6rem;
  background: rgba(239, 68, 68, 0.2);
  border: 1px solid rgba(239, 68, 68, 0.4);
  border-radius: 8px;
  color: #ef4444;
  font-size: 0.85rem;
  font-weight: 700;
  cursor: pointer;
}

/* Boss flash animations */
.boss-display.flash-up {
  animation: bossFlashUp 300ms ease-out;
}

.boss-display.flash-down {
  animation: bossFlashDown 300ms ease-out;
}

@keyframes bossFlashUp {
  0% { transform: scale(1); }
  50% { transform: scale(1.08); box-shadow: 0 0 20px rgba(34, 197, 94, 0.6); }
  100% { transform: scale(1); }
}

@keyframes bossFlashDown {
  0% { transform: scale(1); }
  50% { transform: scale(0.92); box-shadow: 0 0 20px rgba(239, 68, 68, 0.6); }
  100% { transform: scale(1); }
}

</style>

<style id="ui-step4-compact-override">
/* --- STEP4 OVERRIDE: force ultra-compact single-line controls (wins via !important & specificity) --- */
.edit-card .big-keys{
  display:flex !important;
  flex-wrap:nowrap !important;
  gap:.12rem !important;
  align-items:center !important;
  justify-content:center !important;
}
.edit-card .big-keys .key{
  flex:0 0 auto !important;
  min-width:0 !important;
  padding:.2rem .3rem !important;
  font-size:.78rem !important;
  line-height:1 !important;
  border-radius:.45rem !important;
  white-space:nowrap !important;
}
.edit-card .big-keys .key:has(> svg){ /* in case icons exist later */
  padding:.15rem .26rem !important;
}
.edit-card .pv-center{
  width:3.1rem !important;
  padding:.25rem .35rem !important;
  font-size:.9rem !important;
}
/* Optional: tighten the skull/heart emoji button min-width */
.edit-card .big-keys .key:first-child,
.edit-card .big-keys .key:last-child{
  min-width:1.8rem !important;

}
@media (max-width: 420px){
  .edit-card .big-keys{ gap:.1rem !important; }
  .edit-card .big-keys .key{ font-size:.72rem !important; padding:.18rem .26rem !important; }
  .edit-card .pv-center{ width:2.9rem !important; font-size:.85rem !important; }
}

/* === Micro-ajustement PV central (visuel seulement) === */
.edit-card .pv-center {
  height: 36px;
  min-height: 36px;
  line-height: 36px;
  font-weight: 800;
  font-size: 1.05rem;
  text-align: center;
  padding: 0 10px;
  border-radius: .5rem;
  box-sizing: border-box;
  vertical-align: middle;
}

</style>

/* --- STEP5: full-width single row, equal button widths, PV slightly wider --- */
.edit-card .big-keys{
  display:grid !important;
  grid-template-columns: repeat(4, 1fr) 1.25fr repeat(4, 1fr) !important;

  text-align:center !important;
}

  .edit-card .big-keys .key, .edit-card .big-keys button{ font-size:.85rem !important; padding:.34rem .28rem !important; }
  .edit-card .big-keys .pv-center{ font-size:.95rem !important; }
}

</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <h1 class="title">Tableau des Points de Vie</h1>
      <div class="tabs">
        <button class="tab-btn active" id="tab-display" onclick="setTab('display')" aria-label="Mode affichage">Affichage</button>
        <button class="tab-btn" id="tab-edit" onclick="setTab('edit')" aria-label="Mode édition">Édition</button>
      </div>
      <button class="bar-btn" onclick="toggleFullscreen()" aria-label="Activer le mode plein écran">Plein écran</button>
    </div>
  </div>

  <div class="app">
    <section id="section-display" class="section">
      <div class="display-card">
        <div id="display-area"></div>
        <div class="sort-buttons">
          <button onclick="sortPlayers('name')" id="sort-name" class="btn-sort" aria-label="Trier par noms">Noms</button>
          <button onclick="sortPlayers('hpdesc')" id="sort-hpdesc" class="btn-sort" aria-label="Trier par PV décroissants">PV Max</button>
          <button onclick="sortPlayers('hpasc')" id="sort-hpasc" class="btn-sort" aria-label="Trier par PV croissants">PV Min</button>
        </div>
      </div>
    </section>

    <section id="section-edit" class="section" style="display:none;">
      <div class="edit-stack" id="edit-stack"></div>
      <div style="height:.4rem;"></div>
      <div class="display-card" style="margin-top:.2rem;">
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:.4rem;">
          <button class="btn" onclick="addPlayer()" aria-label="Ajouter un nouveau joueur">+ Ajouter</button>
          <button class="btn" onclick="resetAll()" aria-label="Réinitialiser tous les joueurs aux valeurs par défaut">🔄 Réinitialiser</button>
        </div>
      </div>
    </section>
  </div>

  <div id="fullscreen" class="fullscreen">
    <button onclick="toggleFullscreen()" class="btn fullscreen-close" aria-label="Quitter le mode plein écran">Quitter le plein écran</button>
    <div id="fullscreen-content" class="fullscreen-content"></div>
  </div>

  <!-- Vue joueur individuelle (mobile) -->
  <div id="player-view" class="player-view">
    <div id="player-view-content" class="player-view-content"></div>
  </div>

  <!-- Toast pour notifications d'erreurs/succès -->
  <div id="toast" style="position:fixed; top:1rem; left:50%; transform:translateX(-50%); z-index:999; display:none;
    padding:.8rem 1.2rem; background:#ef4444; color:white; border-radius:8px;
    box-shadow:0 4px 12px rgba(0,0,0,.3); font-weight:600; max-width:320px; text-align:center;"></div>

  <script>
    function setTab(which) {
      const isDisplay = which === 'display';
      document.getElementById('section-display').style.display = isDisplay ? '' : 'none';
      document.getElementById('section-edit').style.display = isDisplay ? 'none' : '';
      document.getElementById('tab-display').classList.toggle('active', isDisplay);
      document.getElementById('tab-edit').classList.toggle('active', !isDisplay);
    }

    // Système de notifications toast
    function showToast(msg, type='error') {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.style.background = type === 'error' ? '#ef4444' : type === 'success' ? '#22c55e' : '#f59e0b';
      toast.style.display = 'block';
      setTimeout(() => toast.style.display = 'none', type === 'success' ? 2000 : 4000);
    }

    const defaultPlayers = [
      { id: 1, name: "Alchimiste", hp: 32, max: 50, color: "#4a6edb", shielded: false },
      { id: 2, name: "Destructeur", hp: 48, max: 50, color: "#c13b3b", shielded: false },
      { id: 3, name: "Pyromane", hp: 20, max: 50, color: "#e6a500", shielded: false },
      { id: 4, name: "Déviant", hp: 24, max: 50, color: "#c07ce6", shielded: false },
      { id: 5, name: "Lamevent", hp: 28, max: 50, color: "#60a853", shielded: false }
    ];

    const defaultBosses = [];

    let players = [];
    let bosses = [];
    let sortMode = 'none';
    let nextId = 6;
    let nextBossId = 1;
    const USE_FIREBASE = true;

    let playersCol;
    let bossesCol;

    function saveData() {
      if (!USE_FIREBASE) {
        localStorage.setItem('pv-tracker-v1', JSON.stringify({ players, bosses }));
      }
    }
    function loadData() {
      if (!USE_FIREBASE) {
        const saved = localStorage.getItem('pv-tracker-v1');
        if (saved) {
          try {
            const data = JSON.parse(saved);
            if (data.players) {
              players = data.players;
              bosses = data.bosses || [];
              nextId = players.length ? Math.max(...players.map(p => p.id)) + 1 : 1;
              nextBossId = bosses.length ? Math.max(...bosses.map(b => b.id)) + 1 : 1;
            } else {
              // Old format compatibility
              players = data;
              bosses = [];
              nextId = players.length ? Math.max(...players.map(p => p.id)) + 1 : 1;
              nextBossId = 1;
            }
          }
          catch {
            players = JSON.parse(JSON.stringify(defaultPlayers));
            bosses = JSON.parse(JSON.stringify(defaultBosses));
            nextId = 6;
            nextBossId = 1;
          }
        } else {
          players = JSON.parse(JSON.stringify(defaultPlayers));
          bosses = JSON.parse(JSON.stringify(defaultBosses));
          nextId = 6;
          nextBossId = 1;
        }
      }
    }

    async function resetAll() {
      if (!USE_FIREBASE) {
        players = JSON.parse(JSON.stringify(defaultPlayers));
        bosses = JSON.parse(JSON.stringify(defaultBosses));
        nextId = 6;
        nextBossId = 1;
        return render();
      }
      try {
        // Reset players
        const snap = await playersCol.get();
        const batch1 = db.batch();
        snap.forEach(doc => {
          batch1.set(doc.ref, { __deleted: true, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
        });
        await batch1.commit();

        const batch2 = db.batch();
        defaultPlayers.forEach(p => {
          const ref = playersCol.doc(String(p.id));
          batch2.set(ref, { ...p, __deleted: false, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
        });
        await batch2.commit();

        // Reset bosses
        const bossSnap = await bossesCol.get();
        const batch3 = db.batch();
        bossSnap.forEach(doc => {
          batch3.set(doc.ref, { __deleted: true, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
        });
        await batch3.commit();

        showToast('✅ Réinitialisation réussie', 'success');
      } catch (e) {
        console.error('resetAll failed', e);
        showToast('⚠️ Erreur de réinitialisation. Réessayez.', 'error');
      }
    }

    function addPlayer() {
      if (!USE_FIREBASE) { players.push({ id: nextId++, name: "Nouveau", hp: 10, max: 20, color: "#9ca3af", shielded: false }); return render(); }
      const p = { id: nextId++, name: "Nouveau", hp: 10, max: 20, color: "#9ca3af", shielded: false, __deleted: false, updatedAt: firebase.firestore.FieldValue.serverTimestamp() };
      playersCol.doc(String(p.id)).set(p, { merge: true });
    }

    async function removePlayer(id, docId) {
      // UI optimiste
      players = players.filter(p => p.id != id);
      render();

      if (!USE_FIREBASE) return;
      try {
        if (docId) {
          await playersCol.doc(docId).set({ __deleted: true, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
          return;
        }
      } catch (e) {
        console.warn('soft delete by docId failed, fallback to query', e);
      }
      try {
        const q = await playersCol.where('id', '==', id).limit(1).get();
        if (!q.empty) {
          await q.docs[0].ref.set({ __deleted: true, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
        }
      } catch (e) {
        console.error('soft delete by id failed', e);
        showToast('⚠️ Erreur de suppression. Réessayez.', 'error');
      }
    }

    function updatePlayer(id, field, value) {
      if (!USE_FIREBASE) {
        const player = players.find(p => p.id === id);
        if (player) {
          if (field === 'max') {
            const v = Math.max(1, Number(value)||1);
            player.max = v;
            if (player.hp > v) player.hp = v;
          } else if (field === 'name') {
            player.name = value;
          } else if (field === 'color') {
            player.color = value;
          } else if (field === 'hp') {
            const v = Math.max(0, Math.min(player.max, Number(value)||0));
            player.hp = v;
          }
          render();
        }
        return;
      }
      const patch = { updatedAt: firebase.firestore.FieldValue.serverTimestamp() };
      if (field === 'max') patch.max = Math.max(1, Number(value) || 1);
      else if (field === 'name' || field === 'color') patch[field] = value;
      else if (field === 'hp') patch.hp = Math.max(0, Number(value) || 0);
      playersCol.doc(String(id)).set(patch, { merge: true });
    }

    function toggleShield(id) {
      if (!USE_FIREBASE) {
        const player = players.find(p => p.id === id);
        if (player) {
          player.shielded = !player.shielded;
          render();
        }
        return;
      }
      playersCol.doc(String(id)).get().then(snap => {
        const current = snap.data()?.shielded || false;
        return playersCol.doc(String(id)).set({ shielded: !current, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
      });
    }

    // === BOSS SYSTEM FUNCTIONS ===
    function addBoss() {
      console.log('addBoss called, USE_FIREBASE:', USE_FIREBASE, 'bossesCol:', bossesCol);
      if (!USE_FIREBASE) {
        bosses.push({ id: nextBossId++, name: "Boss", hp: 100, max: 100, color: "#ef4444", imageUrl: "" });
        render();
        return;
      }
      if (!bossesCol) {
        console.error('bossesCol not initialized yet');
        showToast('⚠️ Initialisation en cours, réessayez dans un instant', 'error');
        return;
      }
      const b = { id: nextBossId++, name: "Boss", hp: 100, max: 100, color: "#ef4444", imageUrl: "", __deleted: false, updatedAt: firebase.firestore.FieldValue.serverTimestamp() };
      console.log('Adding boss with nextBossId:', b.id, 'boss object:', b);
      console.log('bossesCol path:', bossesCol.path);
      bossesCol.doc(String(b.id)).set(b, { merge: true })
        .then(() => {
          console.log('Boss added successfully to Firebase!');
          showToast('✅ Adversaire ajouté avec succès', 'success');
        })
        .catch(err => {
          console.error('Error adding boss - Code:', err.code, 'Message:', err.message);
          console.error('Full error:', err);
          showToast(`⚠️ Erreur: ${err.code || 'Vérifiez les règles Firebase'}`, 'error');
        });
    }

    async function removeBoss(id, docId) {
      bosses = bosses.filter(b => b.id != id);
      render();

      if (!USE_FIREBASE) return;
      try {
        if (docId) {
          await bossesCol.doc(docId).set({ __deleted: true, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
          return;
        }
      } catch (e) {
        console.warn('soft delete boss by docId failed', e);
      }
      try {
        const q = await bossesCol.where('id', '==', id).limit(1).get();
        if (!q.empty) {
          await q.docs[0].ref.set({ __deleted: true, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
        }
      } catch (e) {
        console.error('soft delete boss by id failed', e);
        showToast('⚠️ Erreur de suppression. Réessayez.', 'error');
      }
    }

    function updateBoss(id, field, val) {
      if (!USE_FIREBASE) {
        const boss = bosses.find(b => b.id === id);
        if (boss) { boss[field] = val; render(); }
        return;
      }
      const upd = { [field]: val, updatedAt: firebase.firestore.FieldValue.serverTimestamp() };
      bossesCol.doc(String(id)).set(upd, { merge: true });
    }

    function changeBossHP(id, delta) {
      if (!USE_FIREBASE) {
        const boss = bosses.find(b => b.id === id);
        if (boss) {
          boss.hp = Math.max(0, Math.min(boss.max, boss.hp + delta));
          render();
          flashBoss(id, delta > 0 ? 'up' : 'down');
        }
        return;
      }
      bossesCol.doc(String(id)).get().then(snap => {
        const data = snap.data();
        if (!data) return;
        const newHP = Math.max(0, Math.min(data.max, data.hp + delta));
        bossesCol.doc(String(id)).set({ hp: newHP, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
        flashBoss(id, delta > 0 ? 'up' : 'down');
      });
    }

    function flashBoss(id, direction) {
      const el = document.querySelector(`.boss-display[data-boss-id="${id}"]`);
      if (el) {
        el.classList.remove('flash-up', 'flash-down');
        void el.offsetWidth;
        el.classList.add(direction === 'up' ? 'flash-up' : 'flash-down');
        setTimeout(() => el.classList.remove('flash-up', 'flash-down'), 300);
      }
    }

    const debounceMap = new Map();
    function changeHP(id, delta) {
      if (!USE_FIREBASE) {
        const player = players.find(p => p.id === id);
        if (player) {
          // Si blindage actif et dégâts négatifs → désactiver blindage au lieu de perdre HP
          if (player.shielded && delta < 0) {
            player.shielded = false;
            render();
            showToast('🛡️ Blindage absorbe !', 'warning');
            return;
          }
          player.hp = Math.max(0, Math.min(player.max, player.hp + delta));
          render();
          flashPlayer(id, delta > 0 ? 'up' : 'down');
        }
        return;
      }
      clearTimeout(debounceMap.get(id));
      const t = setTimeout(async () => {
        const snap = await playersCol.doc(String(id)).get();
        const p = snap.data(); if (!p) return;
        // Si blindage actif et dégâts négatifs → désactiver blindage au lieu de perdre HP
        if (p.shielded && delta < 0) {
          await playersCol.doc(String(id)).set({ shielded: false, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
          showToast('🛡️ Blindage absorbe !', 'warning');
          return;
        }
        const next = Math.max(0, Math.min(p.max, (p.hp || 0) + delta));
        playersCol.doc(String(id)).set({ hp: next, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
      }, 110);
      debounceMap.set(id, t);
    }
    function setHP(id, value) {
      if (!USE_FIREBASE) {
        const player = players.find(p => p.id === id);
        if (player) {
          const oldHP = player.hp;
          const newHP = Math.max(0, Math.min(player.max, Number(value)||0));
          // Si blindage actif et qu'on tente de réduire les HP → désactiver blindage
          if (player.shielded && newHP < oldHP) {
            player.shielded = false;
            render();
            showToast('🛡️ Blindage absorbe !', 'warning');
            return;
          }
          player.hp = newHP;
          render();
          if (player.hp !== oldHP) flashPlayer(id, player.hp > oldHP ? 'up' : 'down');
        }
        return;
      }
      playersCol.doc(String(id)).get().then(async s => {
        const p = s.data();
        const max = Math.max(1, (p?.max ?? 1));
        const oldHP = p?.hp || 0;
        const clamped = Math.max(0, Math.min(max, Number(value) || 0));
        // Si blindage actif et qu'on tente de réduire les HP → désactiver blindage
        if (p?.shielded && clamped < oldHP) {
          await playersCol.doc(String(id)).set({ shielded: false, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
          showToast('🛡️ Blindage absorbe !', 'warning');
          return;
        }
        return playersCol.doc(String(id)).set({ hp: clamped, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }, { merge: true });
      });
    }

<script>
(function(){
  // Debounce helper
  let rafId = null;
  const schedule = (fn) => {
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(fn);
  };

  function findMaxInput(card){
    const inputs = Array.from(card.querySelectorAll('input[type="number"]'));
    for (const inp of inputs){
      const name = ((inp.name||'') + ' ' + (inp.id||'') + ' ' + (inp.getAttribute('aria-label')||'')).toLowerCase();
      const prev = ((inp.previousElementSibling && inp.previousElementSibling.textContent) || '');
      const label = ((inp.closest('label') && inp.closest('label').textContent) || '');
      if (/\bmax\b/.test(name) || /\bmax\b/i.test(prev) || /\bmax\b/i.test(label)) return inp;
    }
    return null;
  }

  function placeButton(card){
    const btn = card.querySelector('.danger-btn');
    if(!btn) return false;

    // Emoji-only + a11y
    btn.textContent = '🗑️';
    btn.setAttribute('aria-label','Supprimer');
    btn.title = 'Supprimer';
    btn.style.position = 'static';

    const maxInput = findMaxInput(card);
    if(!maxInput) return false;

    // find the "capsule" around max input
    let capsule = maxInput.closest('label') || maxInput.parentElement;
    if (!capsule || capsule.classList.contains('inline-max-with-delete')) return false;

    // Ensure we don't duplicate wrappers. Remove old inline wrapper if it exists and is empty.
    const existingWrapper = capsule.parentElement && capsule.parentElement.classList && capsule.parentElement.classList.contains('inline-max-with-delete') ? capsule.parentElement : null;
    if (existingWrapper && existingWrapper.querySelector('.danger-btn')) {
      // already good
      return true;
    }

    const wrapper = existingWrapper || document.createElement('span');
    if (!existingWrapper) {
      wrapper.className = 'inline-max-with-delete';
      wrapper.style.display = 'inline-flex';
      wrapper.style.alignItems = 'center';
      wrapper.style.gap = '8px';
      capsule.parentElement.insertBefore(wrapper, capsule);
      wrapper.appendChild(capsule);
    }
    wrapper.appendChild(btn);
    return true;
  }

  function applyAll(){
    document.querySelectorAll('.edit-card').forEach(placeButton);
  }

  const boot = () => schedule(applyAll);

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }

  // Observe mutations on the root container to re-apply when cards update
  const root = document.body;
  const mo = new MutationObserver(() => schedule(applyAll));
  mo.observe(root, { childList: true, subtree: true });

  // Also hook common render triggers
  document.addEventListener('click', (e)=>{
    const t = e.target;
    if (!t) return;
    if (t.matches('[data-tab], [data-view], .btn, button')) schedule(applyAll);
  });

  // Expose a global re-align if the app calls render functions we can patch
  window.__alignDeleteNextToMax = applyAll;
})();
</script>

    void btn.offsetWidth; // reflow to replay animation
    btn.classList.add(cls);
    setTimeout(()=> btn.classList.remove(cls), dur);
  };

  document.addEventListener('click', function(e){
    const btn = e.target.closest('button.key, .key button, .key'); // try to catch the visual key
    // If not a key, bail early.
    if (!btn || !(btn.classList && btn.classList.contains('key'))) return;

    const txt = (btn.textContent || "").trim();
    const isNeg = btn.classList.contains('neg') || /^-\d+/.test(txt) || txt.includes('☠');
    const isPos = btn.classList.contains('pos') || /^\+\d+/.test(txt) || txt.includes('💚');

    if (isNeg) return flashBtn(btn, 'btn-flash-neg');
    if (isPos) return flashBtn(btn, 'btn-flash-pos');
  }, true);
})();
</script>


<script>
// UI 6.7: Toggle 'dead' style on hp bars when width is 0%
(function(){
  function updateDeadStates(root=document){
    document.querySelectorAll('.hp-bar').forEach(el=>{
      const cont = el.closest('.hp-bar-container');
      if(!cont) return;

      // read inline width percentage if present
      let w = 0;
      const styleWidth = (el.getAttribute('style')||'').match(/width:\s*([0-9.]+)%/);
      if (styleWidth) w = parseFloat(styleWidth[1]);

      // Fallback: computed width
      if (!styleWidth){
        const cw = el.getBoundingClientRect().width;
        w = cw < 2 ? 0 : 1; // treat ultra thin as zero
      }

      if (w <= 0) cont.classList.add('dead');
      else cont.classList.remove('dead');
    });
  }

  // Run at load and on DOM changes
  const boot = () => requestAnimationFrame(updateDeadStates);
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();

  const mo = new MutationObserver(()=> requestAnimationFrame(updateDeadStates));
  mo.observe(document.body, {childList:true, subtree:true, attributes:true, attributeFilter:['style']});

  // Also re-check when window resizes (rarely needed but safe)
  window.addEventListener('resize', ()=> requestAnimationFrame(updateDeadStates));

  // Expose manual hook
  window.__refreshHpDeadStates = updateDeadStates;
})();
</script>
